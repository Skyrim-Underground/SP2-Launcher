# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "sug-launcher"
version = "0.1.0"
description = "A server browser that installs a server's files and starts the game"
license = "AGPL-3.0-or-later"
edition = "2024"
rust-version = "1.99"

[lib]
name = "sug_launcher_lib"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-opener = "=2.7.1"
tauri-plugin-updater = { version = "=2.13.3", default-features = false, features = ["rustls-tls"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2"] }
minisign-verify = "=0.3.0"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
sha2 = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = { version = "2.5", features = ["serde"] }
base64 = "0.23"
tempfile = "3.27"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[dev-dependencies]
minisign = "0.10"
tauri = { version = "=2.12.3", features = ["test"] }
